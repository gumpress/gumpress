<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Gumpress – WordPress Local Environment</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="GumPress is a free, portable WordPress local development environment for Windows. No setup, no admin rights, ready to use.">

   <!-- Open Graph -->
   <meta property="og:type" content="website">
   <meta property="og:url" content="https://gumpress.github.io/">
   <meta property="og:title" content="GumPress – WordPress Local Environment">
   <meta property="og:description" content="Free, portable WordPress local development environment for Windows. No setup, no admin rights, ready to use.">
   <meta property="og:image" content="https://gumpress.github.io/images/logo.png">

   <!-- Twitter Card -->
   <meta name="twitter:card" content="summary_large_image">
   <meta name="twitter:title" content="GumPress – WordPress Local Environment">
   <meta name="twitter:description" content="Free, portable WordPress local development environment for Windows. No setup, no admin rights, ready to use.">
   <meta name="twitter:image" content="https://gumpress.github.io/images/logo.png">

   <style>
      :root {
         --bg: #0f1115;
         --card: #151821;
         --text: #e6e6e6;
         --muted: #9aa0b2;
         --orange: #ff7a00;
      }

      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
         min-height: 100vh;
         background: radial-gradient(ellipse at center, #1b1f2b 0%, var(--bg) 70%);
         display: flex;
         align-items: center;
         justify-content: center;
         color: var(--text);
      }

      .wrapper {
         text-align: center;
         padding: 40px 30px;
      }

      .logo {
         max-width: 260px;
         width: 70%;
         margin-bottom: 28px;
      }

      h1 {
         font-size: 2.2rem;
         font-weight: 600;
         margin-bottom: 12px;
         letter-spacing: -0.02em;
      }

         h1 span {
            color: var(--orange);
         }

      p {
         font-size: 1rem;
         color: var(--muted);
         max-width: 420px;
         margin: 0 auto;
         line-height: 1.6;
      }

      .badge {
         display: inline-block;
         margin-top: 22px;
         padding: 6px 14px;
         font-size: 0.75rem;
         letter-spacing: 1px;
         text-transform: uppercase;
         border-radius: 999px;
         background: rgba(255, 122, 0, 0.15);
         color: var(--orange);
      }

      .github-link {
         display: inline-flex;
         align-items: center;
         gap: 8px;
         margin-top: 32px;
         padding: 10px 20px;
         font-size: 0.9rem;
         font-weight: 500;
         color: var(--text);
         background: rgba(255,255,255,0.07);
         border: 1px solid rgba(255,255,255,0.1);
         border-radius: 8px;
         text-decoration: none;
         transition: background 0.2s, border-color 0.2s;
      }

         .github-link:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
         }

         .github-link svg {
            flex-shrink: 0;
         }
   </style>
</head>
<body>

   <div class="wrapper">
      <img src="images/logo.png" alt="Gumpress logo" class="logo">
      <p>
         GumPress is a new WordPress environment designed to simplify workflows
         for users and developers.
      </p>

      <div class="badge">
         WordPress Environment
      </div>

      <br>

      <a class="github-link" href="https://github.com/gumpress" target="_blank" rel="noopener">

         View on GitHub
      </a>
   </div>

</body>
</html>
